<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vibe Coding — Dars vositasi yaratish | 우즈베키스탄 바이브코딩 연수</title>
<style>
  :root{
    --ink:#1D1D1F;
    --ink-2:#2C2C2E;
    --body:#5A5A5F;
    --muted:#86868B;
    --line:#EDEDEF;
    --line-2:#D2D2D7;
    --soft:#F5F5F7;
    --accent:#0B64D6;
    --accent-2:#0A84FF;
    --accent-soft:#F0F6FF;
    --w:1280px;
    --h:720px;
    --scale:1;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%;margin:0}
  body{
    background:#DCDCE0;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Apple SD Gothic Neo","Pretendard","Segoe UI",Roboto,sans-serif;
    font-feature-settings:"tnum" 1,"case" 1;
    letter-spacing:-.006em;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ---------- chrome ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;height:52px;z-index:40;overflow:visible;
    display:flex;align-items:center;gap:10px;padding:0 16px;
    padding-top:env(safe-area-inset-top,0px);
    background:rgba(246,246,248,.82);border-bottom:1px solid rgba(0,0,0,.09);
    backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  }
  .lights{display:flex;gap:8px;margin-right:6px;flex:none}
  .lights i{width:12px;height:12px;border-radius:50%;display:block}
  .lights i:nth-child(1){background:#FF5F57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
  .lights i:nth-child(2){background:#FEBC2E;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
  .lights i:nth-child(3){background:#28C840;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
  .addr{
    flex:1;max-width:520px;margin:0 auto;height:30px;border-radius:8px;
    background:rgba(0,0,0,.055);display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:12.5px;color:var(--ink-2);letter-spacing:-.005em;overflow:hidden;white-space:nowrap;padding:0 14px;
  }
  .addr:hover{background:rgba(0,0,0,.08)}
  .addr .lock{font-size:10.5px;color:var(--muted)}
  .addr .host{font-weight:500}
  .addr .path{color:var(--muted)}
  .spacer{flex:1}
  .btn{
    border:0;background:transparent;color:var(--ink-2);
    font-size:13px;font-weight:500;font-family:inherit;letter-spacing:-.005em;
    padding:6px 11px;border-radius:7px;cursor:pointer;white-space:nowrap;transition:.14s;
  }
  .btn:hover{background:rgba(0,0,0,.07)}
  .btn:active{background:rgba(0,0,0,.12)}
  .seg{display:flex;border-radius:8px;overflow:hidden;background:rgba(0,0,0,.055);padding:2px;gap:2px;margin-right:4px}
  .seg button{
    border:0;background:transparent;color:var(--ink-2);font-family:inherit;
    font-size:12px;font-weight:500;letter-spacing:-.003em;padding:5px 11px;cursor:pointer;transition:.14s;border-radius:6px;
  }
  .seg button:hover{background:rgba(0,0,0,.05)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}

  .counter{font-size:12.5px;color:var(--muted);letter-spacing:-.003em;min-width:56px;text-align:center}
  .navbtn{width:38px;height:34px;padding:0;font-size:24px;font-weight:300;line-height:1;color:var(--ink);flex:none;border-radius:9px}
  .zoomctl{display:flex;align-items:center;gap:2px;background:rgba(0,0,0,.055);border-radius:8px;padding:2px 4px;margin-right:4px}
  .zoomctl .navbtn{width:26px;height:26px;font-size:17px;border-radius:7px}
  .zoomctl .navbtn:hover{background:rgba(0,0,0,.08)}
  .zlabel{font-size:11.5px;font-weight:500;color:var(--ink-2);min-width:38px;text-align:center}
  .loadbar{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent}
  .loadbar > div{height:2px;background:var(--accent-2);width:0;transition:width .4s cubic-bezier(.32,.72,0,1)}

  /* ---------- stage ---------- */
  .stage{
    position:fixed;inset:52px 0 0;display:flex;overflow:auto;padding:22px;
    align-items:center;justify-content:center;
    align-items:safe center;justify-content:safe center;
    cursor:default;overscroll-behavior:contain;
  }
  .stage.pannable{cursor:grab}
  .stage.panning{cursor:grabbing;user-select:none}
  .slide{
    width:var(--w);height:var(--h);background:#fff;
    flex:none;zoom:var(--zscale,1);transform:scale(var(--tscale,1));transform-origin:center center;
    border-radius:12px;
    box-shadow:0 0 0 .5px rgba(0,0,0,.07),0 8px 24px rgba(0,0,0,.08),0 30px 70px -20px rgba(0,0,0,.22);
    padding:56px 72px 52px;position:relative;display:none;flex-direction:column;overflow:hidden;
  }
  .slide.active{display:flex}
  .inner{display:flex;flex-direction:column;width:100%;min-height:100%}

  h1.t,h2.t,.card h3,.steps .s h3,.section-slide h2.t{
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
  }
  .eyebrow{font-size:13px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-2);margin-bottom:26px}
  h1.t{font-size:66px;line-height:1.08;font-weight:600;letter-spacing:-.035em;margin:0;color:var(--ink)}
  h2.t{font-size:45px;line-height:1.16;font-weight:600;letter-spacing:-.028em;margin:0;color:var(--ink)}
  .sub-title{font-size:23px;color:var(--body);margin-top:16px;line-height:1.55;font-weight:400}
  .ko{color:var(--muted);font-size:.82em;font-weight:400;display:block;margin-top:6px;line-height:1.5;letter-spacing:0}
  .head{margin-bottom:28px}
  .head .ko{font-size:17px;margin-top:9px}
  .body{flex:0 1 auto}
  .note::before{content:"💡";margin-right:10px;font-size:.92em}
  .note{
    margin-top:26px;padding:0;font-size:19.5px;color:var(--ink-2);font-weight:500;line-height:1.55;
    border-top:1px solid var(--line);padding-top:18px;
  }
  .note .ko{color:var(--muted);font-weight:400}
  .pagenum{position:absolute;right:38px;bottom:26px;font-size:12px;color:#C8CEDA;letter-spacing:.14em}

  /* cover */
  .cover .inner{justify-content:center}
  .cover .meta{margin-top:44px;padding-top:24px;border-top:1px solid var(--line);font-size:18px;color:var(--muted);line-height:1.8;max-width:760px}
  .cover .meta .ko{font-size:16px;margin-top:4px}
  .rule{display:none}

  /* section */
  .section-slide .inner{justify-content:center}
  .section-slide .icon{font-size:52px;line-height:1;margin-bottom:22px}
  .section-slide .num{
    font-size:15px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;
    color:var(--accent-2);margin-bottom:28px;
  }
  .section-slide h2.t{font-size:60px;letter-spacing:-.04em}
  .section-slide .sub-title{font-size:23.5px;margin-top:20px}
  .section-slide .time{
    margin-top:36px;display:inline-block;font-size:14.5px;color:var(--muted);
    letter-spacing:.1em;border-top:1px solid var(--line);padding-top:16px;
  }

  /* agenda */
  .agenda{display:flex;flex-direction:column}
  .agenda .row{display:flex;align-items:baseline;gap:26px;padding:17px 4px;border-top:1px solid var(--line)}
  .agenda .row:last-child{border-bottom:1px solid var(--line)}
  .agenda .row.hl .name{color:var(--accent)}
  .agenda .time{font-size:15.5px;font-weight:600;color:var(--muted);min-width:64px;letter-spacing:.04em}
  .agenda .name{font-size:22.5px;font-weight:600;flex:1;letter-spacing:-.01em}
  .agenda .name .ko{font-size:15.5px;font-weight:400}
  .agenda .dur{font-size:15px;color:var(--muted);letter-spacing:.04em}

  /* cards */
  .cards{display:grid;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .cards.c2{grid-template-columns:1fr 1fr}
  .cards.c3{grid-template-columns:repeat(3,1fr)}
  .cards.c4{grid-template-columns:repeat(2,1fr)}
  .cards.c6{grid-template-columns:repeat(3,1fr)}
  .card{background:#fff;padding:26px 28px;display:flex;flex-direction:column}
  .card .idx{
    width:auto;height:auto;border-radius:0;background:none;color:var(--accent-2);
    font-size:12.5px;font-weight:600;letter-spacing:.2em;display:block;margin-bottom:14px;
  }
  .card h3{margin:0 0 10px;font-size:23.5px;font-weight:600;line-height:1.3;letter-spacing:-.015em;color:var(--ink)}
  .card h3 .ko{font-size:15.5px;font-weight:400}
  .card p{margin:0;font-size:18px;color:var(--body);line-height:1.6}
  .card p .ko{font-size:15px}

  /* rows */
  .rows{display:flex;flex-direction:column}
  .rows .r{display:flex;gap:22px;align-items:flex-start;padding:15px 4px;border-top:1px solid var(--line)}
  .rows .r:last-child{border-bottom:1px solid var(--line)}
  .rows .r.hl b{color:var(--accent)}
  .rows .n{
    width:auto;height:auto;border-radius:0;background:none;color:var(--muted);flex:none;
    font-size:13.5px;font-weight:600;letter-spacing:.08em;margin-top:5px;min-width:22px;
  }
  .rows .r.hl .n{color:var(--accent-2)}
  .rows .tx{flex:1;min-width:0}
  .rows .tx b{display:block;font-size:22px;font-weight:600;line-height:1.4;letter-spacing:-.012em}
  .rows .tx b .ko{font-size:15.5px;font-weight:400}
  .rows .tx span.d{display:block;font-size:17.5px;color:var(--body);margin-top:5px;line-height:1.55}
  .rows .tx span.d .ko{font-size:15px}
  .rows .tag{font-size:14.5px;font-weight:600;color:var(--muted);white-space:nowrap;margin-top:7px;letter-spacing:.06em}

  /* steps */
  .steps{display:flex;gap:0;align-items:stretch;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .steps .s{flex:1;padding:30px 28px 30px 0;display:flex;flex-direction:column;min-width:0}
  .steps .s + .s{padding-left:28px;border-left:1px solid var(--line)}
  .steps .s .idx{
    width:auto;height:auto;border-radius:0;background:none;color:var(--accent-2);
    font-size:12.5px;font-weight:600;letter-spacing:.2em;display:block;margin-bottom:16px;
  }
  .steps .s h3{margin:0 0 11px;font-size:24.5px;font-weight:600;line-height:1.28;letter-spacing:-.018em}
  .steps .s h3 .ko{font-size:15.5px;font-weight:400}
  .steps .s p{margin:0;font-size:18px;color:var(--body);line-height:1.6}
  .steps .s p .ko{font-size:15px}
  .steps .arrow{display:none}

  /* quiz */
  .quiz{display:flex;flex-direction:column}
  .quiz .q{padding:16px 4px;display:flex;gap:22px;border-top:1px solid var(--line)}
  .quiz .q:last-child{border-bottom:1px solid var(--line)}
  .quiz .n{width:auto;height:auto;border-radius:0;background:none;color:var(--muted);font-size:13.5px;font-weight:600;letter-spacing:.08em;flex:none;margin-top:6px;min-width:22px}
  .quiz .q b{display:block;font-size:22px;font-weight:600;line-height:1.4;letter-spacing:-.012em}
  .quiz .q b .ko{font-size:15.5px;font-weight:400}
  .quiz .q .opt{font-size:17.5px;color:var(--body);margin-top:7px;letter-spacing:.01em}
  .quiz .q .opt .ko{font-size:15px}

  /* code */
  .codewrap{display:flex;flex-direction:column}
  .filename{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:12px;letter-spacing:.16em;text-transform:uppercase}
  pre{
    margin:0;overflow:auto;background:var(--soft);border:.5px solid var(--line-2);border-radius:10px;
    padding:26px 30px;
    font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    font-size:16px;line-height:1.72;color:var(--ink-2);white-space:pre;
  }

  /* template blanks */
  .tmpl{display:flex;flex-direction:column;gap:0}
  .tmpl .line{padding:28px 4px;font-size:30px;line-height:1.5;font-weight:500;letter-spacing:-.02em;border-top:1px solid var(--line)}
  .tmpl .line:last-child{border-bottom:1px solid var(--line)}
  .tmpl .line u{text-decoration:none;border-bottom:1px solid var(--accent-2);padding:0 52px;margin:0 8px}
  .tmpl .line .ko{font-size:17px;font-weight:400}

  /* topics + preview */
  .tsplit{display:flex;gap:44px;align-items:flex-start}
  .tlist{flex:1;min-width:0;display:flex;flex-direction:column}
  .tlist .t{display:flex;gap:20px;align-items:baseline;padding:14px 4px;cursor:pointer;border-top:1px solid var(--line);transition:.14s}
  .tlist .t:last-child{border-bottom:1px solid var(--line)}
  .tlist .t:hover b,.tlist .t.on b{color:var(--accent)}
  .tlist .t .n{width:auto;height:auto;border-radius:0;background:none;color:var(--muted);flex:none;font-size:13.5px;font-weight:600;letter-spacing:.08em;min-width:22px}
  .tlist .t:hover .n,.tlist .t.on .n{color:var(--accent-2)}
  .tlist .t b{font-size:20px;font-weight:600;line-height:1.35;letter-spacing:-.012em;transition:.14s}
  .tlist .t b .ko{font-size:15px;font-weight:400}
  .tprev{width:460px;flex:none;border:.5px solid var(--line-2);border-radius:10px;overflow:hidden;background:#fff;height:392px;position:relative}
  .tprev iframe{width:100%;height:100%;border:0;display:none;background:#fff}
  .tprev.live iframe{display:block}
  .tph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:36px;color:var(--muted);font-size:15.5px;line-height:1.7;background:var(--soft)}
  .tprev.live .tph{display:none}

  /* quiz choices */
  .quiz .chs{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
  .quiz .ch{
    font-family:inherit;font-size:16.5px;font-weight:500;color:var(--ink-2);
    background:rgba(0,0,0,.045);border:0;border-radius:10px;padding:9px 16px;cursor:pointer;transition:.14s;text-align:left;
  }
  .quiz .ch:hover{background:rgba(0,0,0,.09)}
  .quiz .ch .ko{font-size:12.5px;margin-top:2px}
  .quiz .ch.ok{background:#E7F6EC;color:#127A3C;box-shadow:inset 0 0 0 1px #A9DCBB}
  .quiz .ch.no{background:#FDECEC;color:#C0392B;box-shadow:inset 0 0 0 1px #F3C0C0}
  .quiz .ch.ok::after{content:" ✓";font-weight:700}
  .quiz .ch.no::after{content:" ✕";font-weight:700}

  /* selectable rows */
  .rows .r[data-shot]{cursor:pointer;transition:.14s}
  .rows .r[data-shot]:hover b{color:var(--accent-2)}
  .rows .r.sel b{color:var(--accent)}
  .rows .r.sel .n{color:var(--accent-2)}
  .rows .r.sel{background:var(--accent-soft);border-radius:10px}

  /* code copy */
  .codehead{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .codehead .filename{margin-bottom:0}
  .copybtn{
    font-family:inherit;font-size:13.5px;font-weight:500;color:#fff;background:var(--accent-2);
    border:0;border-radius:9px;padding:8px 16px;cursor:pointer;transition:.14s;
  }
  .copybtn:hover{background:#0070E0}
  .copybtn.done{background:#12A150}

  /* live demo panel */
  .dsplit{display:flex;gap:30px;align-items:flex-start}
  .dcol{flex:1;min-width:0}
  .dbox{width:498px;flex:none;border:.5px solid var(--line-2);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .dbar{padding:10px 14px;border-bottom:.5px solid var(--line-2);background:rgba(246,246,248,.9);font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .dbox iframe{width:100%;height:352px;border:0;display:block;background:#fff}

  /* inline figure */
  .figsvg{margin-top:24px}
  .figsvg svg{width:100%;height:auto;display:block}

  /* page-by-page viewer */
  .msplit{display:flex;gap:26px;align-items:flex-start}
  .mlist{flex:none;width:378px}
  .mbox{flex:1;min-width:0;border:.5px solid var(--line-2);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(0,0,0,.07)}
  .mbar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:.5px solid var(--line-2);background:rgba(246,246,248,.9)}
  .mbar .lb{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbar button{
    width:30px;height:28px;border:0;background:rgba(0,0,0,.05);color:var(--ink);
    font-family:inherit;font-size:17px;font-weight:400;line-height:1;cursor:pointer;border-radius:7px;transition:.14s;
  }
  .mbar button:hover{background:var(--accent-2);color:#fff}
  .mbar button:disabled{opacity:.3;cursor:default;background:rgba(0,0,0,.04);color:var(--muted)}
  .mbar .pg{font-size:13px;font-weight:600;color:var(--ink-2);min-width:52px;text-align:center}
  .mbar .zl{font-size:12px;font-weight:500;color:var(--muted);min-width:42px;text-align:center}
  .mview{height:474px;overflow:auto;background:#F2F2F4;position:relative;display:block}
  .mview img{display:block;width:100%;height:auto;cursor:pointer}
  .mdots{display:flex;gap:5px;justify-content:center;padding:9px 0 10px;border-top:.5px solid var(--line-2);background:#fff}
  .mdots i{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.16);display:block;cursor:pointer;transition:.14s}
  .mdots i.on{background:var(--accent-2);width:18px;border-radius:3px}

  /* inline link */
  .ilink{display:inline-block;margin-left:12px;font-size:16.5px;font-weight:400;color:var(--accent-2);text-decoration:none;transition:.14s}
  .ilink:hover{text-decoration:underline;text-underline-offset:3px}

  /* PRD tool */
  .prd{display:grid;grid-template-columns:1fr 1fr;gap:20px 36px}
  .prd .f{display:flex;flex-direction:column}
  .prd label{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:7px;letter-spacing:-.005em}
  .prd label i{font-style:normal;color:var(--accent-2);margin-right:8px;font-size:12.5px;letter-spacing:.1em}
  .prd label .ko{font-size:14px;margin-top:2px}
  .prd textarea{
    font-family:inherit;font-size:15.5px;color:var(--ink-2);line-height:1.45;
    border:0;border-bottom:1px solid var(--line-2);border-radius:0;padding:7px 2px;resize:none;height:48px;background:transparent;transition:.14s;
  }
  .prd textarea::placeholder{color:#B6BDCB}
  .prd textarea:focus{outline:none;border-bottom-color:var(--accent-2);background:rgba(10,132,255,.04)}
  .prdout{margin-top:26px;display:flex;gap:20px;align-items:stretch}
  .prdout textarea{
    flex:1;font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;font-size:13.5px;line-height:1.6;
    border:.5px solid var(--line-2);padding:14px 16px;background:var(--soft);color:var(--ink-2);height:112px;resize:none;border-radius:10px;
  }
  .prdbtns{display:flex;flex-direction:column;gap:8px;width:170px;flex:none}
  .prdbtns button{font-family:inherit;font-size:14.5px;font-weight:500;padding:10px 12px;cursor:pointer;border-radius:9px;transition:.14s;letter-spacing:-.008em}
  .prdbtns .primary{background:var(--accent-2);color:#fff;border:0}
  .prdbtns .primary:hover{background:#0070E0}
  .prdbtns .ghost{background:rgba(0,0,0,.05);color:var(--ink);border:0}
  .prdbtns .ghost:hover{background:rgba(0,0,0,.09)}
  .prdbtns small{font-size:12.5px;color:var(--muted);line-height:1.5;text-align:center;margin-top:2px}

  /* info box */
  .infobox{margin-top:24px;border:.5px solid var(--line-2);border-radius:14px;padding:20px 24px;background:var(--soft);display:flex;gap:30px}
  .infobox .it{flex:1;display:flex;gap:14px;align-items:flex-start}
  .infobox .ic{font-size:30px;line-height:1.1}
  .infobox b{font-size:18px;font-weight:600;display:block;line-height:1.4}
  .infobox b .ko{font-size:14px;font-weight:400}

  /* row copy button */
  .rowcopy{
    font-family:inherit;font-size:13px;font-weight:600;color:#fff;background:var(--accent-2);
    border:0;border-radius:8px;padding:7px 13px;cursor:pointer;margin-left:12px;transition:.14s;vertical-align:2px;
  }
  .rowcopy:hover{background:#0070E0}
  .rowcopy.done{background:#12A150}

  /* fill-in blanks */

/* ====================== RENDER ====================== */
let lang = localStorage.getItem('uzdeck-lang') || 'uz';
let cur = 0;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function T(o, allowHtml){
  if(!o) return '';
  const uz = allowHtml ? o.uz : esc(o.uz);
  const ko = allowHtml ? o.ko : esc(o.ko);
  if(lang === 'uz')  return uz;
  if(lang === 'ko')  return ko;
  return uz + '<span class="ko">' + ko + '</span>';
}
function L(){ return lang === 'ko' ? 'ko' : 'uz'; }
function one(o){ return (typeof o === 'string') ? o : o[L()]; }
const UI = {
  gen:   {uz:"Prompt yaratish", ko:"프롬프트 만들기"},
  copy:  {uz:"Nusxa olish", ko:"복사하기"},
  hint:  {uz:"Nusxalab Claude ga qo'ying", ko:"복사해 클로드에 붙여넣기"},
  outPh: {uz:"Prompt shu yerda paydo bo'ladi...", ko:"여기에 프롬프트가 생성됩니다..."},
  copied:{uz:"Nusxalandi", ko:"복사되었습니다"},
  manualLb:{uz:"Qo'llanma", ko:"실습 매뉴얼"},
  demoLb:{uz:"Namuna — sinab ko'ring", ko:"예시 앱 — 직접 해보세요"},
  credLb:{uz:"Hisob ma'lumotlari", ko:"계정 정보"},
  credBtn:{uz:"ID / parolni ko'rish", ko:"아이디 / 비밀번호 확인하기"},
  credAsk:{uz:"Maxfiy kodni kiriting", ko:"암호를 입력하세요"},
  credNo:{uz:"Kod noto'g'ri", ko:"암호가 올바르지 않습니다"},
  credOk:{uz:"Tasdiqlash", ko:"확인"},
  videoPh:{uz:"Video havolasi keyinroq qo'shiladi", ko:"영상 링크를 넣어 주세요 (유튜브 embed 주소)"},
  hover: {uz:"Chap tomondagi mavzuga sichqonchani olib boring — namuna shu yerda ochiladi va uni sinab ko'rishingiz mumkin",
          ko:"왼쪽 주제에 마우스를 올리면 여기에 예시 앱이 열리고 직접 눌러볼 수 있습니다"},
  manual:{uz:"Matnni qo'lda nusxalang", ko:"직접 선택해 복사해 주세요"}
};
function D(str){
  if(lang !== 'ko') return str;
  return String(str)
    .replace(/(\d+)\s*daqiqa/g, '$1분')
    .replace(/(\d+)\s*daq\b/g, '$1분')
    .replace(/(\d+)\s*kun\b/g, '$1일')
    .replace(/(\d+)\s*soat\b/g, '$1시간');
}
function titleOf(s){
  if(s.type === 'cover' || s.type === 'section') return lang === 'ko' ? s.title.ko : s.title.uz;
  return lang === 'ko' ? s.title.ko : s.title.uz;
}

function head(s){
  return '<div class="head"><h2 class="t">' + T(s.title) +
    (s.tip ? '<span class="tip">?<span class="tipbox">' + T(s.tip) + '</span></span>' : '') + '</h2>' +
    (s.subtitle ? '<div class="sub-title" style="font-size:17px;margin-top:10px">' + T(s.subtitle) + '</div>' : '') +
    '</div>';
}
function noteOf(s){ return s.note ? '<div class="note">' + T(s.note) + '</div>' : ''; }
function boxOf(s){
  if(!s.box) return '';
  return '<div class="infobox">' + s.box.map(b =>
    '<div class="it"><div class="ic">' + b.icon + '</div><b>' + T(b.t) + '</b></div>').join('') + '</div>';
}
function quotesOf(s){
  if(!s.quotes) return '';
  return '<div class="quotes">' + s.quotes.map(q => '<div class="qt">' + T(q) + '</div>').join('') + '</div>';
}
function credsOf(s){
  if(!s.creds) return '';
  return '<div class="creds" data-pass="' + s.creds.pass + '">' +
    '<div class="ch">' + esc(UI.credLb[L()]) + '</div>' +
    '<div class="cbody"><button data-c="open">' + esc(UI.credBtn[L()]) + '</button></div>' +
  '</div>';
}

function linkOf(s){
  const arr = s.links || (s.link ? [s.link] : []);
  if(!arr.length) return '';
  return '<div class="linkrow">' + arr.map(l =>
    '<div class="linkbox">' +
      (l.qr ? '<img alt="QR" src="data:image/png;base64,' + l.qr + '">' : '') +
      '<div class="lt"><b>' + T(l.label) + '</b>' +
      '<a class="url" href="' + l.url + '" target="_blank" rel="noopener">' + esc(l.text || l.url) + '</a></div>' +
    '</div>').join('') + '</div>';
}

function render(s, i){
  const el = document.createElement('div');
  el.className = 'slide';
  el.dataset.index = i;
  let h = '';

  if(s.type === 'cover'){
    el.classList.add('cover');
    h = '<div class="eyebrow">' + esc(s.eyebrow) + '</div>' +
        '<h1 class="t">' + T(s.title) + '</h1>' +
        '<div class="rule"></div>' +
        '<div class="sub-title">' + T(s.subtitle) + '</div>' +
        '<div class="meta">' + T(s.meta) + '</div>';
  }

  else if(s.type === 'section'){
    el.classList.add('section-slide');
    h = (s.icon ? '<div class="icon">' + s.icon + '</div>' : '') +

function initCode(el){

  } catch(e) { toast(UI.manual[L()]); }

function initManual(el){
  const box = el.querySelector('.mbox');
  if(!box) return;
  const shots = box.dataset.shots.split('|');
  const img = box.querySelector('.mview img');
  const view = box.querySelector('.mview');
  const pg = box.querySelector('.pg');
  const zl = box.querySelector('.zl');
  const dots = [...box.querySelectorAll('.mdots i')];
  const prevB = box.querySelector('[data-p="prev"]');
  const nextB = box.querySelector('[data-p="next"]');
  const zooms = [1, 1.3, 1.7, 2.2, 3];
  let i = Math.min(shots.length - 1, parseInt(box.dataset.start, 10) || 0);
  let z = 0;
  const draw = () => {
    img.src = shots[i];
    img.style.width = (100 * zooms[z]) + '%';
    pg.textContent = (i + 1) + ' / ' + shots.length;
    zl.textContent = Math.round(zooms[z] * 100) + '%';
    dots.forEach((d, n) => d.classList.toggle('on', n === i));
    rows.forEach(r => r.classList.toggle('sel', parseInt(r.dataset.shot, 10) === i));
    prevB.disabled = i === 0;
    nextB.disabled = i === shots.length - 1;
  };
  const rows = [...el.querySelectorAll('.rows .r[data-shot]')];
  const go = (d) => { i = Math.max(0, Math.min(shots.length - 1, i + d)); view.scrollTop = 0; view.scrollLeft = 0; draw(); };
  prevB.onclick = () => go(-1);
  nextB.onclick = () => go(1);
  img.onclick = () => go(i === shots.length - 1 ? -i : 1);
  dots.forEach((d, n) => d.onclick = () => { i = n; view.scrollTop = 0; draw(); });
  rows.forEach(r => r.onclick = () => { i = parseInt(r.dataset.shot, 10); view.scrollTop = 0; view.scrollLeft = 0; draw(); });
  box.querySelectorAll('[data-z]').forEach(b => b.onclick = () => {
    z = b.dataset.z === 'in' ? Math.min(zooms.length - 1, z + 1) : Math.max(0, z - 1);
    draw();
  });
  draw();
}

const ZOOM_OK = window.CSS && CSS.supports && CSS.supports('zoom','0.5');
function shrink(el){
  if(!el) return;
  const inner = el.querySelector('.inner');
  if(!inner) return;
  inner.style.zoom = ''; inner.style.transform = ''; inner.style.width = '';
  const cs = getComputedStyle(el);
  const avail = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const natural = inner.scrollHeight;
  if(avail <= 0 || natural <= 0) return;
  if(natural <= avail + 1) return;
  const k = Math.max(0.55, avail / natural);
  if(ZOOM_OK){ inner.style.zoom = k; }
  else { inner.style.transform = 'scale(' + k + ')'; inner.style.transformOrigin = 'top left'; inner.style.width = (100 / k) + '%'; }
}

const ZOOMS = [0.6, 0.75, 0.9, 1, 1.2, 1.45, 1.75, 2.2];
let zi = 3;
function fit(){
  const pad = 24;
  const w = stage.clientWidth - pad * 2;
  const h = stage.clientHeight - pad * 2;
  const base = Math.min(w / 1280, h / 720, 1.35);
  const sc = base * ZOOMS[zi];
  const root = document.documentElement.style;
  if(ZOOM_OK){ root.setProperty('--zscale', sc); root.setProperty('--tscale', 1); }
  else { root.setProperty('--tscale', sc); root.setProperty('--zscale', 1); }
  const lab = document.getElementById('zoomLabel');
  if(lab) lab.textContent = Math.round(ZOOMS[zi] * 100) + '%';
  requestAnimationFrame(markPannable);
}
function markPannable(){
  const can = stage.scrollWidth > stage.clientWidth + 1 || stage.scrollHeight > stage.clientHeight + 1;
  stage.classList.toggle('pannable', can);
}
function deckZoom(dir){
  if(dir === 0) zi = 3;
  else zi = Math.max(0, Math.min(ZOOMS.length - 1, zi + dir));
  fit();
  shrink(stage.children[cur]);
}

function buildOverview(){
  const g = document.getElementById('ovgrid');
  g.innerHTML = SLIDES.map((s, i) =>
    '<button class="ovcard' + (i === cur ? ' cur' : '') + '" data-go="' + i + '">' +
      '<div class="no">' + String(i + 1).padStart(2, '0') + '</div>' +
      '<div class="tt">' + esc(titleOf(s)) + '</div>' +
      '<div class="bl">' + esc(s.block) + '</div>' +
    '</button>').join('');
  [...g.querySelectorAll('.ovcard')].forEach(b => b.addEventListener('click', () => {
    show(+b.dataset.go);
    document.getElementById('overlay').classList.remove('open');
  }));
}

/* ---- controls ---- */
document.getElementById('prev').onclick = () => show(cur - 1);
document.getElementById('addr').onclick = () => document.getElementById('ovBtn').click();
document.getElementById('zoomIn').onclick = () => deckZoom(1);
document.getElementById('zoomOut').onclick = () => deckZoom(-1);
document.getElementById('zoomLabel').onclick = () => deckZoom(0);
document.getElementById('next').onclick = () => show(cur + 1);
document.getElementById('ovBtn').onclick = () => document.getElementById('overlay').classList.toggle('open');
document.getElementById('ovClose').onclick = () => document.getElementById('overlay').classList.remove('open');
function prepPrint(){
  document.body.classList.add('printing');
  [...stage.children].forEach(shrink);
}
function endPrint(){
  document.body.classList.remove('printing');
  shrink(stage.children[cur]);
}
function doPrint(){
  prepPrint();
  void stage.offsetHeight;                 // majburiy layout
  let failed = false;
  try { window.print(); } catch(e) { failed = true; }
  setTimeout(endPrint, 400);
  if(failed) toast(lang === 'ko' ? '브라우저에서 Ctrl+P (Mac은 Cmd+P)를 눌러 주세요' : 'Ctrl+P (Mac: Cmd+P) tugmasini bosing');
}
window.addEventListener('beforeprint', prepPrint);
window.addEventListener('afterprint', endPrint);
document.getElementById('pdfBtn').onclick = doPrint;
document.getElementById('fsBtn').onclick = () => {
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
};
document.querySelectorAll('#langseg button').forEach(b => {
  b.onclick = () => {
    lang = b.dataset.lang;
    localStorage.setItem('uzdeck-lang', lang);
    document.querySelectorAll('#langseg button').forEach(x => x.classList.toggle('on', x === b));
    applyUI();
    build();
  };
});

function updateAddr(){
  const a = document.getElementById('addr');
  if(!a) return;
  const host = (location.hostname || 'vibe-coding').replace(/^www\./, '');
  a.querySelector('.host').textContent = host === '' ? 'vibe-coding' : host;
  a.querySelector('.path').textContent = '/#/' + (cur + 1);
}

function applyUI(){
  document.querySelectorAll('[data-uz][data-ko]').forEach(el => {
    el.textContent = (lang === 'ko') ? el.dataset.ko : el.dataset.uz;
  });
  document.documentElement.lang = (lang === 'ko') ? 'ko' : 'uz';
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800);
}

document.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable) return;
  if(e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); show(cur + 1); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(cur - 1); }
  else if(e.key === 'Home') show(0);
  else if(e.key === 'End') show(SLIDES.length - 1);
  else if(e.key === 'f' || e.key === 'F') document.getElementById('fsBtn').click();
  else if(e.key === 'o' || e.key === 'O') document.getElementById('ovBtn').click();
  else if(e.key === 'p' || e.key === 'P') doPrint();
  else if(e.key === '+' || e.key === '=') deckZoom(1);
  else if(e.key === '-' || e.key === '_') deckZoom(-1);
  else if(e.key === '0') deckZoom(0);
  else if(e.key === 'Escape') document.getElementById('overlay').classList.remove('open');
});

let tx = 0;
stage.addEventListener('touchstart', e => { tx = e.changedTouches[0].clientX; }, {passive:true});
stage.addEventListener('touchend', e => {
  const d = e.changedTouches[0].clientX - tx;
  if(Math.abs(d) > 60) show(cur + (d < 0 ? 1 : -1));
}, {passive:true});

function relayout(){ fit(); shrink(stage.children[cur]); markPannable(); }
window.addEventListener('resize', relayout);
window.addEventListener('orientationchange', relayout);
document.addEventListener('fullscreenchange', () => setTimeout(relayout, 60));
if(window.ResizeObserver){
  let lastW = 0, lastH = 0, pending = false;
  const ro = new ResizeObserver(() => {
    if(pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      const w = stage.clientWidth, h = stage.clientHeight;
      if(Math.abs(w - lastW) < 2 && Math.abs(h - lastH) < 2) return;
      lastW = w; lastH = h;
      relayout();
    });
  });
  ro.observe(stage);
}

/* drag to pan */
(function(){
  let on = false, sx = 0, sy = 0, sl = 0, st = 0;
  const skip = (t) => !!(t.closest && t.closest('input,textarea,button,a,iframe,select,[data-app],[data-shot],.mdots,.mview'));
  stage.addEventListener('pointerdown', e => {
    if(e.button !== 0 || skip(e.target)) return;
    if(stage.scrollWidth <= stage.clientWidth + 1 && stage.scrollHeight <= stage.clientHeight + 1) return;
    on = true; sx = e.clientX; sy = e.clientY; sl = stage.scrollLeft; st = stage.scrollTop;
    stage.classList.add('panning');
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if(!on) return;
    stage.scrollLeft = sl - (e.clientX - sx);
    stage.scrollTop  = st - (e.clientY - sy);
  });
  const end = (e) => {
    if(!on) return;
    on = false; stage.classList.remove('panning');
    try { stage.releasePointerCapture(e.pointerId); } catch(err) {}
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
})();
window.addEventListener('hashchange', () => {
  const n = parseInt((location.hash.match(/\d+/) || [])[0], 10);
  if(n && n - 1 !== cur) show(n - 1, false);
});

/* init */
document.querySelectorAll('#langseg button').forEach(x => x.classList.toggle('on', x.dataset.lang === lang));
applyUI();
const startN = parseInt((location.hash.match(/\d+/) || [])[0], 10);
cur = startN ? Math.min(SLIDES.length, Math.max(1, startN)) - 1 : 0;
build();
</script>
