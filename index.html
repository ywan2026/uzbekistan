<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vibe Coding — Dars vositasi yaratish | 우즈베키스탄 바이브코딩 연수</title>
<style>
  :root{
    --ink:#0C1424;
    --ink-2:#1B2739;
    --body:#55607A;
    --muted:#98A1B3;
    --line:#EBEEF4;
    --line-2:#DDE2EC;
    --soft:#F7F8FB;
    --accent:#1B3FA8;
    --accent-2:#3B6BE0;
    --accent-soft:#F3F6FD;
    --w:1280px;
    --h:720px;
    --scale:1;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%;margin:0}
  body{
    background:#E9EBF0;
    color:var(--ink);
    font-family:"Pretendard","Inter","Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;
    font-feature-settings:"tnum" 1,"case" 1;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ---------- chrome ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;height:50px;z-index:40;
    display:flex;align-items:center;gap:8px;padding:0 18px;
    padding-top:env(safe-area-inset-top,0px);
    background:rgba(255,255,255,.88);border-bottom:1px solid var(--line-2);
    backdrop-filter:saturate(180%) blur(10px);
  }
  .brand{font-size:13.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
  .brand span{color:var(--muted);font-weight:400;margin-left:10px;letter-spacing:.02em;text-transform:none}
  .spacer{flex:1}
  .btn{
    border:1px solid transparent;background:transparent;color:var(--body);
    font-size:13.5px;font-weight:500;font-family:inherit;letter-spacing:.01em;
    padding:7px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;transition:.14s;
  }
  .btn:hover{background:var(--soft);color:var(--ink)}
  .seg{display:flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:#fff;margin-right:6px}
  .seg button{
    border:0;background:transparent;color:var(--muted);font-family:inherit;
    font-size:12.5px;font-weight:600;letter-spacing:.05em;padding:7px 12px;cursor:pointer;transition:.14s;
  }
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--ink);color:#fff}

  .bottombar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;height:50px;
    display:flex;align-items:center;gap:14px;padding:0 18px;
    padding-bottom:env(safe-area-inset-bottom,0px);
    background:rgba(255,255,255,.88);border-top:1px solid var(--line-2);
    backdrop-filter:saturate(180%) blur(10px);
  }
  .counter{font-size:13px;color:var(--muted);letter-spacing:.06em;min-width:62px}
  .track{flex:1;height:1px;background:var(--line-2)}
  .track > div{height:1px;background:var(--accent);width:0;transition:width .35s cubic-bezier(.4,0,.2,1)}
  .navbtn{width:32px;height:32px;padding:0;font-size:16px;line-height:1;color:var(--ink-2)}

  /* ---------- stage ---------- */
  .stage{position:fixed;inset:50px 0;display:grid;place-items:center;overflow:hidden}
  .slide{
    width:var(--w);height:var(--h);background:#fff;
    transform:scale(var(--scale));transform-origin:center center;
    box-shadow:0 1px 1px rgba(12,20,36,.04),0 18px 50px -12px rgba(12,20,36,.16);
    padding:62px 76px 58px;position:relative;display:none;flex-direction:column;overflow:hidden;
  }
  .slide.active{display:flex}
  .inner{display:flex;flex-direction:column;width:100%;min-height:100%}

  .eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-2);margin-bottom:26px}
  h1.t{font-size:64px;line-height:1.08;font-weight:600;letter-spacing:-.035em;margin:0;color:var(--ink)}
  h2.t{font-size:43px;line-height:1.16;font-weight:600;letter-spacing:-.028em;margin:0;color:var(--ink)}
  .sub-title{font-size:21.5px;color:var(--body);margin-top:16px;line-height:1.55;font-weight:400}
  .ko{color:var(--muted);font-size:.74em;font-weight:400;display:block;margin-top:6px;line-height:1.5;letter-spacing:0}
  .head{margin-bottom:32px}
  .head .ko{font-size:15.5px;margin-top:9px}
  .body{flex:0 1 auto}
  .note{
    margin-top:26px;padding:0;font-size:18px;color:var(--ink-2);font-weight:500;line-height:1.55;
    border-top:1px solid var(--line);padding-top:18px;
  }
  .note .ko{color:var(--muted);font-weight:400}
  .pagenum{position:absolute;right:38px;bottom:26px;font-size:12px;color:#C8CEDA;letter-spacing:.14em}

  /* cover */
  .cover .inner{justify-content:center}
  .cover .meta{margin-top:50px;padding-top:26px;border-top:1px solid var(--line);font-size:17px;color:var(--muted);line-height:1.8;max-width:760px}
  .cover .meta .ko{font-size:14.5px;margin-top:4px}
  .rule{display:none}

  /* section */
  .section-slide .inner{justify-content:center}
  .section-slide .num{
    font-size:14px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;
    color:var(--accent-2);margin-bottom:28px;
  }
  .section-slide h2.t{font-size:60px;letter-spacing:-.04em}
  .section-slide .sub-title{font-size:22px;margin-top:20px}
  .section-slide .time{
    margin-top:36px;display:inline-block;font-size:14.5px;color:var(--muted);
    letter-spacing:.1em;border-top:1px solid var(--line);padding-top:16px;
  }

  /* agenda */
  .agenda{display:flex;flex-direction:column}
  .agenda .row{display:flex;align-items:baseline;gap:26px;padding:17px 4px;border-top:1px solid var(--line)}
  .agenda .row:last-child{border-bottom:1px solid var(--line)}
  .agenda .row.hl .name{color:var(--accent)}
  .agenda .time{font-size:14.5px;font-weight:600;color:var(--muted);min-width:64px;letter-spacing:.04em}
  .agenda .name{font-size:21px;font-weight:600;flex:1;letter-spacing:-.01em}
  .agenda .name .ko{font-size:14px;font-weight:400}
  .agenda .dur{font-size:14px;color:var(--muted);letter-spacing:.04em}

  /* cards */
  .cards{display:grid;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .cards.c2{grid-template-columns:1fr 1fr}
  .cards.c3{grid-template-columns:repeat(3,1fr)}
  .cards.c4{grid-template-columns:repeat(2,1fr)}
  .cards.c6{grid-template-columns:repeat(3,1fr)}
  .card{background:#fff;padding:26px 28px;display:flex;flex-direction:column}
  .card .idx{
    width:auto;height:auto;border-radius:0;background:none;color:var(--accent-2);
    font-size:12.5px;font-weight:600;letter-spacing:.2em;display:block;margin-bottom:14px;
  }
  .card h3{margin:0 0 10px;font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-.015em;color:var(--ink)}
  .card h3 .ko{font-size:14px;font-weight:400}
  .card p{margin:0;font-size:17px;color:var(--body);line-height:1.6}
  .card p .ko{font-size:13.5px}

  /* rows */
  .rows{display:flex;flex-direction:column}
  .rows .r{display:flex;gap:22px;align-items:flex-start;padding:15px 4px;border-top:1px solid var(--line)}
  .rows .r:last-child{border-bottom:1px solid var(--line)}
  .rows .r.hl b{color:var(--accent)}
  .rows .n{
    width:auto;height:auto;border-radius:0;background:none;color:var(--muted);flex:none;
    font-size:13.5px;font-weight:600;letter-spacing:.08em;margin-top:5px;min-width:22px;
  }
  .rows .r.hl .n{color:var(--accent-2)}
  .rows .tx{flex:1;min-width:0}
  .rows .tx b{display:block;font-size:20.5px;font-weight:600;line-height:1.4;letter-spacing:-.012em}
  .rows .tx b .ko{font-size:14px;font-weight:400}
  .rows .tx span.d{display:block;font-size:16.5px;color:var(--body);margin-top:5px;line-height:1.55}
  .rows .tx span.d .ko{font-size:13.5px}
  .rows .tag{font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;margin-top:7px;letter-spacing:.06em}

  /* steps */
  .steps{display:flex;gap:0;align-items:stretch;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .steps .s{flex:1;padding:30px 28px 30px 0;display:flex;flex-direction:column;min-width:0}
  .steps .s + .s{padding-left:28px;border-left:1px solid var(--line)}
  .steps .s .idx{
    width:auto;height:auto;border-radius:0;background:none;color:var(--accent-2);
    font-size:12.5px;font-weight:600;letter-spacing:.2em;display:block;margin-bottom:16px;
  }
  .steps .s h3{margin:0 0 11px;font-size:23px;font-weight:600;line-height:1.28;letter-spacing:-.018em}
  .steps .s h3 .ko{font-size:14px;font-weight:400}
  .steps .s p{margin:0;font-size:17px;color:var(--body);line-height:1.6}
  .steps .s p .ko{font-size:13.5px}
  .steps .arrow{display:none}

  /* quiz */
  .quiz{display:flex;flex-direction:column}
  .quiz .q{padding:16px 4px;display:flex;gap:22px;border-top:1px solid var(--line)}
  .quiz .q:last-child{border-bottom:1px solid var(--line)}
  .quiz .n{width:auto;height:auto;border-radius:0;background:none;color:var(--muted);font-size:13.5px;font-weight:600;letter-spacing:.08em;flex:none;margin-top:6px;min-width:22px}
  .quiz .q b{display:block;font-size:20.5px;font-weight:600;line-height:1.4;letter-spacing:-.012em}
  .quiz .q b .ko{font-size:14px;font-weight:400}
  .quiz .q .opt{font-size:16.5px;color:var(--body);margin-top:7px;letter-spacing:.01em}
  .quiz .q .opt .ko{font-size:13.5px}

  /* code */
  .codewrap{display:flex;flex-direction:column}
  .filename{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:12px;letter-spacing:.16em;text-transform:uppercase}
  pre{
    margin:0;overflow:auto;background:var(--soft);border:1px solid var(--line);
    padding:26px 30px;
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    font-size:16px;line-height:1.72;color:var(--ink-2);white-space:pre;
  }

  /* template blanks */
  .tmpl{display:flex;flex-direction:column;gap:0}
  .tmpl .line{padding:30px 4px;font-size:29px;line-height:1.5;font-weight:500;letter-spacing:-.02em;border-top:1px solid var(--line)}
  .tmpl .line:last-child{border-bottom:1px solid var(--line)}
  .tmpl .line u{text-decoration:none;border-bottom:1px solid var(--accent-2);padding:0 52px;margin:0 8px}
  .tmpl .line .ko{font-size:15.5px;font-weight:400}

  /* topics + preview */
  .tsplit{display:flex;gap:44px;align-items:flex-start}
  .tlist{flex:1;min-width:0;display:flex;flex-direction:column}
  .tlist .t{display:flex;gap:20px;align-items:baseline;padding:14px 4px;cursor:pointer;border-top:1px solid var(--line);transition:.14s}
  .tlist .t:last-child{border-bottom:1px solid var(--line)}
  .tlist .t:hover b,.tlist .t.on b{color:var(--accent)}
  .tlist .t .n{width:auto;height:auto;border-radius:0;background:none;color:var(--muted);flex:none;font-size:13.5px;font-weight:600;letter-spacing:.08em;min-width:22px}
  .tlist .t:hover .n,.tlist .t.on .n{color:var(--accent-2)}
  .tlist .t b{font-size:19px;font-weight:600;line-height:1.35;letter-spacing:-.012em;transition:.14s}
  .tlist .t b .ko{font-size:13.5px;font-weight:400}
  .tprev{width:460px;flex:none;border:1px solid var(--line);overflow:hidden;background:#fff;height:392px;position:relative}
  .tprev iframe{width:100%;height:100%;border:0;display:none;background:#fff}
  .tprev.live iframe{display:block}
  .tph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:36px;color:var(--muted);font-size:15.5px;line-height:1.7;background:var(--soft)}
  .tprev.live .tph{display:none}

  /* inline link */
  .ilink{display:inline-block;margin-left:12px;font-size:16.5px;font-weight:500;color:var(--accent-2);text-decoration:none;border-bottom:1px solid var(--line-2);transition:.14s}
  .ilink:hover{border-bottom-color:var(--accent-2)}

  /* PRD tool */
  .prd{display:grid;grid-template-columns:1fr 1fr;gap:20px 36px}
  .prd .f{display:flex;flex-direction:column}
  .prd label{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:7px;letter-spacing:-.005em}
  .prd label i{font-style:normal;color:var(--accent-2);margin-right:8px;font-size:12.5px;letter-spacing:.1em}
  .prd label .ko{font-size:13px;margin-top:2px}
  .prd textarea{
    font-family:inherit;font-size:15.5px;color:var(--ink-2);line-height:1.45;
    border:0;border-bottom:1px solid var(--line-2);border-radius:0;padding:7px 2px;resize:none;height:48px;background:transparent;transition:.14s;
  }
  .prd textarea::placeholder{color:#B6BDCB}
  .prd textarea:focus{outline:none;border-bottom-color:var(--accent-2)}
  .prdout{margin-top:26px;display:flex;gap:20px;align-items:stretch}
  .prdout textarea{
    flex:1;font-family:"SFMono-Regular",Consolas,monospace;font-size:13.5px;line-height:1.6;
    border:1px solid var(--line);padding:14px 16px;background:var(--soft);color:var(--ink-2);height:112px;resize:none;border-radius:0;
  }
  .prdbtns{display:flex;flex-direction:column;gap:8px;width:170px;flex:none}
  .prdbtns button{font-family:inherit;font-size:15px;font-weight:600;padding:11px 12px;cursor:pointer;border-radius:0;transition:.14s;letter-spacing:-.005em}
  .prdbtns .primary{background:var(--ink);color:#fff;border:1px solid var(--ink)}
  .prdbtns .primary:hover{background:var(--accent)}
  .prdbtns .ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line-2)}
  .prdbtns .ghost:hover{border-color:var(--ink);color:var(--ink)}
  .prdbtns small{font-size:12.5px;color:var(--muted);line-height:1.5;text-align:center;margin-top:2px}

  /* link + QR */
  .linkbox{display:flex;align-items:center;gap:28px;border-top:1px solid var(--line);padding-top:24px;margin-top:28px}
  .linkbox img{width:96px;height:96px;flex:none}
  .linkbox .lt{flex:1;min-width:0}
  .linkbox .lt b{display:block;font-size:18px;font-weight:600;line-height:1.4;letter-spacing:-.012em}
  .linkbox .lt b .ko{font-size:13.5px;font-weight:400}
  .linkbox .url{display:inline-block;margin-top:9px;font-size:19.5px;font-weight:500;color:var(--accent-2);word-break:break-all;text-decoration:none;letter-spacing:-.01em}
  .linkbox .url:hover{text-decoration:underline;text-underline-offset:4px}

  /* overview */
  .overlay{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);display:none;overflow:auto;padding:74px 42px 46px}
  .overlay.open{display:block}
  .ovhead{display:flex;align-items:center;margin-bottom:26px;gap:14px}
  .ovhead h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
  .ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
  .ovcard{border:0;background:#fff;padding:18px 20px;cursor:pointer;text-align:left;font-family:inherit;transition:.14s}
  .ovcard:hover{background:var(--accent-soft)}
  .ovcard.cur{background:var(--ink)}
  .ovcard.cur .no{color:#7FA0F0}
  .ovcard.cur .tt{color:#fff}
  .ovcard.cur .bl{color:#8A97B4}
  .ovcard .no{font-size:11.5px;font-weight:600;color:var(--accent-2);letter-spacing:.18em}
  .ovcard .tt{font-size:15.5px;font-weight:600;margin-top:8px;line-height:1.4;color:var(--ink);letter-spacing:-.012em}
  .ovcard .bl{font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:.08em;text-transform:uppercase}

  .toast{
    position:fixed;left:50%;bottom:70px;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:12.5px;font-weight:500;letter-spacing:.01em;
    padding:10px 18px;border-radius:4px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .toast.show{opacity:1}

  .hint{position:fixed;right:20px;bottom:60px;font-size:11px;color:#B6BDCB;z-index:30;letter-spacing:.04em}

  @media (max-width:820px){
    .brand span,.hint{display:none}
    .btn{padding:7px 8px;font-size:12px}
  }

  /* ---------- print / PDF ---------- */
  .printing{overflow:visible}
  .printing .stage{position:static;inset:auto;display:block;overflow:visible}
  .printing .slide{display:flex !important;transform:none !important;margin:0 auto;box-shadow:none}
  @media print{
    @page{size:13.34in 7.52in;margin:0}
    html,body{background:#fff;overflow:visible;height:auto}
    .topbar,.bottombar,.overlay,.toast,.hint{display:none !important}
    .stage{position:static;inset:auto;display:block;overflow:visible}
    .slide{
      display:flex !important;transform:none !important;
      width:1280px;height:716px;box-shadow:none;overflow:hidden;
      page-break-after:always;break-after:page;
    }
    .slide:last-child{page-break-after:auto;break-after:auto}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Vibe Coding<span id="brandSub" data-uz="Dars vositasi yaratish" data-ko="바이브코딩 연수">Dars vositasi yaratish</span></div>
  <div class="spacer"></div>
  <div class="seg" id="langseg">

  <button class="btn" id="fsBtn" data-uz="To'liq ekran" data-ko="전체화면">To'liq ekran</button>
</div>

<div class="stage" id="stage"></div>

<div class="bottombar">

<script>
/* ====================== CONTENT ====================== */
const CODE_GS = `// Code.gs — Google Apps Script
// Jadvaldan ochilgani uchun ID yozish shart emas.
// Kengaytmalar > Apps Script orqali oching!

// Veb-sahifani ochadi
function doGet() {
  return HtmlService.createHtmlOutputFromFile('index');
}

// Javobni jadvalga saqlaydi  ->  BU BACKEND
function saveAnswer(name, answer) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];
  if (sheet.getLastRow() === 0) {
    sheet.appendRow(['Vaqt', 'Ism', 'Javob']);
  }
  sheet.appendRow([new Date(), name, answer]);
  return 'OK';
}

// Tekshirish uchun: shu funksiyani editorda ishga tushiring
function test() {
  saveAnswer('Test', 'Salom');
}`;

const CODE_HTML = `<!-- index.html — Apps Script ichida yangi HTML fayl -->
<!-- Fayl nomi aynan  index  bo'lishi shart -->
<input id="name" placeholder="Ismingiz">
<input id="answer" placeholder="Javobingiz">
<button onclick="send()">Yuborish</button>
<p id="msg"></p>

<script>
function send() {
  const name = document.getElementById('name').value;
  const answer = document.getElementById('answer').value;
  if (!name || !answer) { return; }

  google.script.run
    .withSuccessHandler(function () {
      document.getElementById('msg').textContent = 'Saqlandi!';
      document.getElementById('answer').value = '';
    })
    .withFailureHandler(function (e) {
      document.getElementById('msg').textContent = 'Xato: ' + e.message;
    })
    .saveAnswer(name, answer);
}
<\/script>`;

sort: `<!doctype html><meta charset="utf-8"><style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:0;padding:16px;color:#111827}

  title:{uz:"Rahmat!", ko:"감사합니다"},
  subtitle:{uz:"Bugun yaratgan vositangiz sizda qoladi — va bu faqat boshlanishi.", ko:"오늘 만든 도구는 여러분의 것입니다"},
  meta:{uz:"Onlayn mentorlik: 1–3 oy · Qo'shimcha materiallar: Supabase va GitHub qo'llanmasi · Natijalar galereyasi ochiq qoladi", ko:"사후 온라인 멘토링 · 심화 자료 · 결과물 갤러리 유지 · 안용원 (대한민국 서울)"} }
];

/* ====================== RENDER ====================== */
let lang = localStorage.getItem('uzdeck-lang') || 'uz';
let cur = 0;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function T(o, allowHtml){
  if(!o) return '';
  const uz = allowHtml ? o.uz : esc(o.uz);
  const ko = allowHtml ? o.ko : esc(o.ko);
  if(lang === 'uz')  return uz;
  if(lang === 'ko')  return ko;
  return uz + '<span class="ko">' + ko + '</span>';
}
function L(){ return lang === 'ko' ? 'ko' : 'uz'; }
function one(o){ return (typeof o === 'string') ? o : o[L()]; }
const UI = {
  gen:   {uz:"Prompt yaratish", ko:"프롬프트 만들기"},
  copy:  {uz:"Nusxa olish", ko:"복사하기"},
  hint:  {uz:"Nusxalab Claude ga qo'ying", ko:"복사해 클로드에 붙여넣기"},
  outPh: {uz:"Prompt shu yerda paydo bo'ladi...", ko:"여기에 프롬프트가 생성됩니다..."},
  copied:{uz:"Nusxalandi", ko:"복사되었습니다"},
  hover: {uz:"Chap tomondagi mavzuga sichqonchani olib boring — namuna shu yerda ochiladi va uni sinab ko'rishingiz mumkin",
          ko:"왼쪽 주제에 마우스를 올리면 여기에 예시 앱이 열리고 직접 눌러볼 수 있습니다"},
  manual:{uz:"Matnni qo'lda nusxalang", ko:"직접 선택해 복사해 주세요"}
};
function D(str){
  if(lang !== 'ko') return str;
  return String(str)
    .replace(/(\d+)\s*daqiqa/g, '$1분')
    .replace(/(\d+)\s*daq\b/g, '$1분')
    .replace(/(\d+)\s*kun\b/g, '$1일')
    .replace(/(\d+)\s*soat\b/g, '$1시간');
}
function titleOf(s){
  if(s.type === 'cover' || s.type === 'section') return lang === 'ko' ? s.title.ko : s.title.uz;
  return lang === 'ko' ? s.title.ko : s.title.uz;
}

function head(s){
  return '<div class="head"><h2 class="t">' + T(s.title) + '</h2>' +
    (s.subtitle ? '<div class="sub-title" style="font-size:17px;margin-top:10px">' + T(s.subtitle) + '</div>' : '') +
    '</div>';
}
function noteOf(s){ return s.note ? '<div class="note">' + T(s.note) + '</div>' : ''; }
function linkOf(s){
  if(!s.link) return '';
  return '<div class="linkbox">' +
    (s.link.qr ? '<img alt="QR" src="data:image/png;base64,' + s.link.qr + '">' : '') +
    '<div class="lt"><b>' + T(s.link.label) + '</b>' +
    '<a class="url" href="' + s.link.url + '" target="_blank" rel="noopener">' + s.link.url + '</a></div>' +
  '</div>';
}

function render(s, i){
  const el = document.createElement('div');
  el.className = 'slide';
  el.dataset.index = i;
  let h = '';

  if(s.type === 'cover'){
    el.classList.add('cover');
    h = '<div class="eyebrow">' + esc(s.eyebrow) + '</div>' +
        '<h1 class="t">' + T(s.title) + '</h1>' +
        '<div class="rule"></div>' +
        '<div class="sub-title">' + T(s.subtitle) + '</div>' +
        '<div class="meta">' + T(s.meta) + '</div>';
  }

  else if(s.type === 'section'){
    el.classList.add('section-slide');
    h = '<div class="num">' + esc(s.num) + ' · ' + esc(s.name) + '</div>' +
        '<h2 class="t">' + T(s.title) + '</h2>' +
        '<div class="sub-title">' + T(s.subtitle) + '</div>' +
        '<div><span class="time">' + esc(D(s.time)) + '</span></div>';
  }

  else if(s.type === 'agenda'){
    h = head(s) + '<div class="body"><div class="agenda">' +
      s.items.map(it =>
        '<div class="row' + (it.hl ? ' hl' : '') + '">' +
          '<div class="time">' + esc(it.time) + '</div>' +
          '<div class="name">' + T(it.name) + '</div>' +
          '<div class="dur">' + esc(D(it.dur)) + '</div>' +
        '</div>').join('') +
      '</div></div>';
  }

  else if(s.type === 'cards'){
    h = head(s) + '<div class="body"><div class="cards c' + (s.cols || 3) + '">' +
      s.items.map((it, n) =>
        '<div class="card">' +
          '<div class="idx">' + String(n + 1).padStart(2, '0') + '</div>' +
          '<h3>' + T(it.t) + '</h3>' +
          '<p>' + T(it.d) + '</p>' +
        '</div>').join('') +
      '</div></div>' + noteOf(s);
  }

  else if(s.type === 'rows'){
    h = head(s) + '<div class="body"><div class="rows">' +
      s.items.map((it, n) =>
        '<div class="r' + (it.hl ? ' hl' : '') + '">' +
          '<div class="n">' + String(n + 1).padStart(2, '0') + '</div>' +
          '<div class="tx"><b>' + T(it.t) +
            (it.url ? '<a class="ilink" href="' + it.url + '" target="_blank" rel="noopener">' + (it.urlText || it.url) + '</a>' : '') +
          '</b>' +
            (it.d ? '<span class="d">' + T(it.d) + '</span>' : '') +
          '</div>' +
          (it.tag ? '<div class="tag">' + esc(D(it.tag)) + '</div>' : '') +
        '</div>').join('') +
      '</div></div>' + linkOf(s) + noteOf(s);
  }

  else if(s.type === 'steps'){
    const parts = [];
    s.items.forEach((it, n) => {
      parts.push('<div class="s"><div class="idx">' + String(n + 1).padStart(2, '0') + '</div>' +
        '<h3>' + T(it.t) + '</h3><p>' + T(it.d) + '</p></div>');
      if(n < s.items.length - 1) parts.push('<div class="arrow">&rsaquo;</div>');
    });
    h = head(s) + '<div class="body"><div class="steps">' + parts.join('') + '</div></div>' + noteOf(s);
  }

  else if(s.type === 'quiz'){
    h = head(s) + '<div class="body"><div class="quiz">' +
      s.items.map((it, n) =>
        '<div class="q"><div class="n">' + String(n + 1).padStart(2, '0') + '</div>' +
          '<div><b>' + T(it.q) + '</b><div class="opt">' + T(it.opt) + '</div></div>' +
        '</div>').join('') +
      '</div></div>' + noteOf(s);
  }

  else if(s.type === 'topics'){
    h = head(s) + '<div class="body"><div class="tsplit">' +
      '<div class="tlist">' +
        s.items.map((it, n) =>
          '<div class="t" data-app="' + it.app + '"><div class="n">' + String(n + 1).padStart(2, '0') + '</div>' +
          '<b>' + T(it.t) + '</b></div>').join('') +
      '</div>' +
      '<div class="tprev"><iframe title="namuna"></iframe>' +
        '<div class="tph">' + esc(UI.hover[L()]) + '</div></div>' +
      '</div></div>' + noteOf(s);
  }

  else if(s.type === 'prd'){
    h = head(s) + '<div class="body">' +
      '<div class="prd">' +
        s.fields.map((f, n) =>
          '<div class="f"><label><i>' + String(n + 1).padStart(2, '0') + '</i>' + T(f.label) + '</label>' +
          '<textarea data-k="' + f.key + '" placeholder="' + esc(one(f.ph)) + '"></textarea></div>').join('') +
      '</div>' +
      '<div class="prdout">' +
        '<textarea class="out" readonly placeholder="' + esc(UI.outPh[L()]) + '"></textarea>' +
        '<div class="prdbtns">' +
          '<button class="primary" data-act="gen">' + esc(UI.gen[L()]) + '</button>' +
          '<button class="ghost" data-act="copy">' + esc(UI.copy[L()]) + '</button>' +
          '<small>' + esc(UI.hint[L()]) + '</small>' +
        '</div>' +
      '</div>' +
      '</div>' + noteOf(s);
  }

  else if(s.type === 'code'){
    h = head(s) + '<div class="body codewrap">' +
      '<div class="filename">' + esc(s.filename) + '</div>' +
      '<pre>' + esc(s.code) + '</pre></div>';
  }

  else if(s.type === 'template'){
    h = head(s) + '<div class="body"><div class="tmpl">' +
      s.lines.map(l => '<div class="line">' + T(l, true) + '</div>').join('') +
      '</div></div>' + noteOf(s);
  }

  el.innerHTML = '<div class="inner">' + h + '</div>' +
    '<div class="pagenum">' + (i + 1) + ' / ' + SLIDES.length + '</div>';
  return el;
}

function initTopics(el){
  const list = el.querySelector('.tlist');
  if(!list) return;
  const prev = el.querySelector('.tprev');
  const frame = prev.querySelector('iframe');
  const load = (row) => {
    const code = APPS[row.dataset.app];
    if(!code) return;
    [...list.children].forEach(c => c.classList.toggle('on', c === row));
    frame.srcdoc = code;
    prev.classList.add('live');
  };
  [...list.children].forEach(row => {
    row.addEventListener('mouseenter', () => load(row));
    row.addEventListener('click', () => load(row));
  });
}

function initPRD(el){
  const wrap = el.querySelector('.prd');
  if(!wrap) return;
  const out = el.querySelector('.out');
  const labels = {maqsad:'Maqsad', user:'Foydalanuvchi', func:'Asosiy funksiyalar', ekran:'Ekran', data:"Ma'lumot", limit:'Cheklovlar'};
  const build = () => {
    const v = {};
    el.querySelectorAll('.prd textarea').forEach(t => v[t.dataset.k] = t.value.trim());
    const lines = Object.keys(labels)
      .filter(k => v[k])
      .map(k => labels[k] + ': ' + v[k]);
    if(!lines.length){ out.value = ''; return; }
    out.value =
      'Menga dars uchun oddiy veb-vosita yarat.\n\n' +
      lines.join('\n') +
      '\n\nBarcha matnlar o\'zbek tilida bo\'lsin.' +
      '\nKodni bitta index.html faylda ber.' +
      '\nDizayn sodda va katta harfli bo\'lsin.';
  };
  el.querySelector('[data-act="gen"]').onclick = build;
  el.querySelector('[data-act="copy"]').onclick = () => {
    build();
    if(!out.value) return;
    out.select();
    try {
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(out.value); }
      else { document.execCommand('copy'); }
      toast(UI.copied[L()]);
    } catch(e) { toast(UI.manual[L()]); }
  };
}

const stage = document.getElementById('stage');
function build(){
  stage.innerHTML = '';
  SLIDES.forEach((s, i) => { const el = render(s, i); stage.appendChild(el); initPRD(el); initTopics(el); });
  show(cur, false);
  buildOverview();
}

function show(i, push){
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  [...stage.children].forEach((el, n) => el.classList.toggle('active', n === cur));
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + SLIDES.length;
  document.getElementById('bar').style.width = ((cur + 1) / SLIDES.length * 100) + '%';
  if(push !== false){
    try { history.replaceState(null, '', '#/' + (cur + 1)); } catch(e) { /* file:// yoki preview */ }
  }
  [...document.querySelectorAll('.ovcard')].forEach((c, n) => c.classList.toggle('cur', n === cur));
  fit();
  shrink(stage.children[cur]);
}

const ZOOM_OK = window.CSS && CSS.supports && CSS.supports('zoom','0.5');
function shrink(el){
  if(!el) return;
  const inner = el.querySelector('.inner');
  if(!inner) return;
  inner.style.zoom = ''; inner.style.transform = ''; inner.style.width = '';
  const cs = getComputedStyle(el);
  const avail = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const natural = inner.scrollHeight;
  if(avail <= 0 || natural <= 0) return;
  if(natural <= avail + 1) return;
  const k = Math.max(0.55, avail / natural);
  if(ZOOM_OK){ inner.style.zoom = k; }
  else { inner.style.transform = 'scale(' + k + ')'; inner.style.transformOrigin = 'top left'; inner.style.width = (100 / k) + '%'; }
}

function fit(){
  const pad = 28;
  const w = stage.clientWidth - pad * 2;
  const h = stage.clientHeight - pad * 2;
  const sc = Math.min(w / 1280, h / 720, 1.35);
  document.documentElement.style.setProperty('--scale', sc);
}

function buildOverview(){
  const g = document.getElementById('ovgrid');
  g.innerHTML = SLIDES.map((s, i) =>
    '<button class="ovcard' + (i === cur ? ' cur' : '') + '" data-go="' + i + '">' +
      '<div class="no">' + String(i + 1).padStart(2, '0') + '</div>' +
      '<div class="tt">' + esc(titleOf(s)) + '</div>' +
      '<div class="bl">' + esc(s.block) + '</div>' +
    '</button>').join('');
  [...g.querySelectorAll('.ovcard')].forEach(b => b.addEventListener('click', () => {
    show(+b.dataset.go);
    document.getElementById('overlay').classList.remove('open');
  }));
}

/* ---- controls ---- */
document.getElementById('prev').onclick = () => show(cur - 1);
document.getElementById('next').onclick = () => show(cur + 1);
document.getElementById('ovBtn').onclick = () => document.getElementById('overlay').classList.toggle('open');
document.getElementById('ovClose').onclick = () => document.getElementById('overlay').classList.remove('open');
function prepPrint(){
  document.body.classList.add('printing');
  [...stage.children].forEach(shrink);
}
function endPrint(){
  document.body.classList.remove('printing');
  shrink(stage.children[cur]);
}
function doPrint(){
  prepPrint();
  void stage.offsetHeight;                 // majburiy layout
  let failed = false;
  try { window.print(); } catch(e) { failed = true; }
  setTimeout(endPrint, 400);
  if(failed) toast(lang === 'ko' ? '브라우저에서 Ctrl+P (Mac은 Cmd+P)를 눌러 주세요' : 'Ctrl+P (Mac: Cmd+P) tugmasini bosing');
}
window.addEventListener('beforeprint', prepPrint);
window.addEventListener('afterprint', endPrint);
document.getElementById('pdfBtn').onclick = doPrint;
document.getElementById('fsBtn').onclick = () => {
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
};
document.querySelectorAll('#langseg button').forEach(b => {
  b.onclick = () => {
    lang = b.dataset.lang;
    localStorage.setItem('uzdeck-lang', lang);
    document.querySelectorAll('#langseg button').forEach(x => x.classList.toggle('on', x === b));
    applyUI();
    build();
  };
});

function applyUI(){
  document.querySelectorAll('[data-uz][data-ko]').forEach(el => {
    el.textContent = (lang === 'ko') ? el.dataset.ko : el.dataset.uz;
  });
  document.documentElement.lang = (lang === 'ko') ? 'ko' : 'uz';
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800);
}

document.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable) return;
  if(e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); show(cur + 1); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(cur - 1); }
  else if(e.key === 'Home') show(0);
  else if(e.key === 'End') show(SLIDES.length - 1);
  else if(e.key === 'f' || e.key === 'F') document.getElementById('fsBtn').click();
  else if(e.key === 'o' || e.key === 'O') document.getElementById('ovBtn').click();
  else if(e.key === 'p' || e.key === 'P') doPrint();
  else if(e.key === 'Escape') document.getElementById('overlay').classList.remove('open');
});

let tx = 0;
stage.addEventListener('touchstart', e => { tx = e.changedTouches[0].clientX; }, {passive:true});
stage.addEventListener('touchend', e => {
  const d = e.changedTouches[0].clientX - tx;
  if(Math.abs(d) > 60) show(cur + (d < 0 ? 1 : -1));
}, {passive:true});

window.addEventListener('resize', () => { fit(); shrink(stage.children[cur]); });
window.addEventListener('hashchange', () => {
  const n = parseInt((location.hash.match(/\d+/) || [])[0], 10);
  if(n && n - 1 !== cur) show(n - 1, false);
});

/* init */
document.querySelectorAll('#langseg button').forEach(x => x.classList.toggle('on', x.dataset.lang === lang));
applyUI();
const startN = parseInt((location.hash.match(/\d+/) || [])[0], 10);
cur = startN ? Math.min(SLIDES.length, Math.max(1, startN)) - 1 : 0;
build();
</script>
</body>
</html>
